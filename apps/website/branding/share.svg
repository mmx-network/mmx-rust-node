<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>MMX Network</title>
  <defs><radialGradient id="share-light"><stop stop-color="#4c1d95" stop-opacity=".5"/><stop offset="1" stop-color="#07060b" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="630" fill="#07060b"/>
  <ellipse cx="500" cy="300" rx="680" ry="480" fill="url(#share-light)"/>
  <g transform="translate(124 187)"><defs>
    <path id="mmx-glyph" d="M94.29 72H117.66L174.78 184H138.34L87.16 83.64A8 8 0 0 1 94.29 72ZM147.08 72H183.48L158.65 120.69L140.45 85ZM108.92 184H72.52L97.35 135.31L115.55 171ZM112.77 34H128.54L126.6 58.2H110.83ZM142.19 34H157.95L156.01 58.2H140.25ZM99.99 197.8H115.75L113.81 222H98.05ZM129.4 197.8H145.17L143.23 222H127.46Z"/>
    <filter id="surface-grain" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" seed="19"/>
      <feColorMatrix type="matrix" values="0.6 1.2 0.2 0 -0.5
                                          0.6 1.2 0.2 0 -0.5
                                          0.6 1.2 0.2 0 -0.43
                                          0   0   0   0  0.15"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="12.086" y1="-10.141" x2="243.914" y2="266.141">
      <stop stop-color="#634298"/>
      <stop offset="0.48" stop-color="#4c307b"/>
      <stop offset="1" stop-color="#31204f"/>
    </linearGradient>
    <radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="128" cy="128" r="128">
      <stop offset="0.91" stop-color="#bf93e8" stop-opacity="0"/>
      <stop offset="0.95" stop-color="#bf93e8" stop-opacity="0.14"/>
      <stop offset="0.99" stop-color="#bf93e8" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#bf93e8" stop-opacity="0.44"/>
    </radialGradient>
    <linearGradient id="glyph-light" gradientUnits="userSpaceOnUse" x1="82" y1="34" x2="169" y2="222">
      <stop stop-color="#f5eafd"/>
      <stop offset="1" stop-color="#dfc9f3"/>
    </linearGradient>
  </defs>
  <!-- A transparent gutter keeps the circular rim away from the image's clip edge. -->
  <g transform="translate(4 4) scale(0.96875)">
    <g transform="rotate(-9 128 128)">
      <circle cx="128" cy="128" r="128" fill="url(#base)"/>
      <circle cx="128" cy="128" r="128" fill="url(#rim)"/>
      <use href="#mmx-glyph" fill="url(#glyph-light)" transform="translate(128 128) scale(1.1) translate(-128 -128)"/>
      <circle cx="128" cy="128" r="125" filter="url(#surface-grain)"/>
    </g>
  </g></g>
  <g fill="#efecf8" font-family="Space Grotesk, Inter, DejaVu Sans, sans-serif">
    <text x="434" y="287" font-size="66" font-weight="600" letter-spacing="-2">MMX Network</text>
    <text x="434" y="345" font-size="28" fill="#b4aecb">Decentralized by design.</text>
    <text x="434" y="405" font-size="19" fill="#b197fc">mmx.network</text>
  </g>
</svg>
