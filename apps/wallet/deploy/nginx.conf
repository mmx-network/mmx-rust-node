# MMX Wallet (web) for nginx. Replace server_name, certificate paths and root.
# Copy nginx-security-headers.conf to /etc/nginx/snippets/mmx-wallet-security-headers.conf.
server {
    listen 80;
    listen [::]:80;
    server_name wallet.example.org;
    return 301 https://$host$request_uri;
}

server {
    # The "http2" listen parameter works on every nginx in current distributions
    # (1.25.1 and later only warn that "http2 on;" is the newer form).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wallet.example.org;

    ssl_certificate     /etc/letsencrypt/live/wallet.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/mmx-wallet;
    index index.html;
    server_tokens off;
    charset utf-8;

    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js;
        application/wasm          wasm;
        application/json          json;
        application/manifest+json webmanifest;
        image/svg+xml             svg;
        image/png                 png;
        font/woff2                woff2;
    }

    gzip on;
    gzip_types text/css text/javascript application/wasm application/json application/manifest+json image/svg+xml;

    location = / {
        include snippets/mmx-wallet-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include snippets/mmx-wallet-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include snippets/mmx-wallet-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include snippets/mmx-wallet-security-headers.conf;
        try_files $uri =404;
    }
}
