# Apps use hash routing and the website uses page anchors; keep real 404s.
# Keep add_header at server scope so every location inherits the security policy.
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
}
location = / { try_files /index.html =404; }
location = /_headers { return 404; }
location ~ (^|/)\. { return 404; }
location / { try_files $uri =404; }
