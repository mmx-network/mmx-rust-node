[package]
name = "mmx-consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MMX native consensus hashing, static validation and signature authorization"

[dependencies]
mmx-types.workspace = true
mmx-crypto.workspace = true
vnx.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Browser wallets reuse the transaction codec, hashing and authorization. Proof
# work and OpenCL remain native-only and are never linked into their WASM core.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mmx-opencl.workspace = true
primitive-types.workspace = true
rayon = "1.11"

[dev-dependencies]
mmx-vm.workspace = true
k256.workspace = true
