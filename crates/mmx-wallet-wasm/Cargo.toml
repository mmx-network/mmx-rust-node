[package]
name = "mmx-wallet-wasm"
description = "Browser bindings for the MMX wallet core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Adds deterministic signing and account derivation hooks for parity tests.
# Never enabled for the shipped web wallet.
test-nonce = []

[dependencies]
mmx-wallet = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
wasm-bindgen = "=0.2.127"
js-sys = "0.3.104"
getrandom = "0.2"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
