name: Web apps image
on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'deploy/apps/**'
      - 'apps/wallet/**'
      - 'apps/explorer/**'
      - 'crates/mmx-wallet/**'
      - 'crates/mmx-wallet-wasm/**'
      - 'crates/**/Cargo.toml'
      - 'vendor/vnx-rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/apps.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'deploy/apps/**'
      - 'apps/wallet/**'
      - 'apps/explorer/**'
      - 'crates/mmx-wallet/**'
      - 'crates/mmx-wallet-wasm/**'
      - 'crates/**/Cargo.toml'
      - 'vendor/vnx-rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/apps.yml'
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test deploy/apps/prepare.test.mjs
      - run: docker compose config --quiet
      - run: nice -n 19 ionice -c 3 docker build --tag mmx-apps .
      - run: python3 deploy/apps/test-image.py mmx-apps
      - run: nice -n 19 ionice -c 3 docker build --build-arg VITE_RPC_URL=https://rpc.example.org:8443/api --tag mmx-apps:rpc-test .
      - run: python3 deploy/apps/test-image.py mmx-apps:rpc-test --rpc-origin https://rpc.example.org:8443
