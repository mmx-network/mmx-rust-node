name: Binaries
on:
  workflow_dispatch:
  push:
    branches: [node-build]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p mmx-node -p mmx-tools -p mmxwallet
      - name: Package binaries and source revision
        shell: bash
        run: |
          for bin in mmx-node mmx mmx-wallet mmxwallet mmx-farmer mmx-harvester; do target/release/$bin --help; done
          mkdir -p dist/bin
          for bin in mmx-node mmx mmx-wallet mmxwallet mmx-farmer mmx-harvester; do cp target/release/$bin dist/bin/; done
          ln -s mmx-node dist/bin/mmx_node
          ln -s mmx-farmer dist/bin/mmx_farmer
          ln -s mmx-harvester dist/bin/mmx_harvester
          printf '%s\n' "$GITHUB_SHA" > dist/COMMIT
          tar -C dist -czf "mmx-node-linux-x86_64-${GITHUB_SHA}.tar.gz" COMMIT bin
          sha256sum "mmx-node-linux-x86_64-${GITHUB_SHA}.tar.gz" > "mmx-node-linux-x86_64-${GITHUB_SHA}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mmx-node-linux-x86_64-${{ github.sha }}
          path: mmx-node-linux-x86_64-*.tar.gz*
          retention-days: 7
          if-no-files-found: error
  linux-musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p mmx-node -p mmx-tools -p mmxwallet
      - name: Package portable binaries and source revision
        shell: bash
        run: |
          for bin in mmx-node mmx mmx-wallet mmxwallet mmx-farmer mmx-harvester; do target/x86_64-unknown-linux-musl/release/$bin --help; done
          mkdir -p dist/bin
          for bin in mmx-node mmx mmx-wallet mmxwallet mmx-farmer mmx-harvester; do cp target/x86_64-unknown-linux-musl/release/$bin dist/bin/; done
          ln -s mmx-node dist/bin/mmx_node
          ln -s mmx-farmer dist/bin/mmx_farmer
          ln -s mmx-harvester dist/bin/mmx_harvester
          printf '%s\n' "$GITHUB_SHA" > dist/COMMIT
          tar -C dist -czf "mmx-node-linux-x86_64-musl-${GITHUB_SHA}.tar.gz" COMMIT bin
          sha256sum "mmx-node-linux-x86_64-musl-${GITHUB_SHA}.tar.gz" > "mmx-node-linux-x86_64-musl-${GITHUB_SHA}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mmx-node-linux-x86_64-musl-${{ github.sha }}
          path: mmx-node-linux-x86_64-musl-*.tar.gz*
          retention-days: 7
          if-no-files-found: error
