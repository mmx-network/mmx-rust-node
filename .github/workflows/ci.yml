name: Rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --locked -p mmx-node -p mmxwallet -p mmx-tools
      - run: cargo test --workspace --all-targets --locked --no-fail-fast
      - run: cargo run --locked -p mmx-node --example security_review
      - run: python3 tools/test_wallet_cli.py --binary target/debug/mmxwallet -v
      - run: python3 tools/test_wallet_cli.py --binary target/debug/mmx -v
