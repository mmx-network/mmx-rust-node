name: Rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install software OpenCL ICD for kernel conformance tests
        run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd
      - run: cargo fmt --all --check
      - run: python3 -m unittest discover -s tools -p test_systemd_units.py -v
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --locked -p mmx-node -p mmxwallet -p mmx-tools
      - run: cargo test --workspace --all-targets --locked --no-fail-fast
        env:
          MMX_OPENCL_TESTS: '1'
          MMX_OPENCL_ALL_DEVICES: '1'
          POCL_MAX_PTHREAD_COUNT: '2'
      - run: python3 tools/test_wallet_cli.py --binary target/debug/mmxwallet -v
      - run: python3 tools/test_wallet_cli.py --binary target/debug/mmx -v
  arm-vdf:
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RAYON_NUM_THREADS: '4'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked -p mmx-crypto -p mmx-consensus -p mmx-timelord --all-targets -- -D warnings
      - run: cargo test --locked -p mmx-crypto -p mmx-consensus -p mmx-timelord -- --nocapture
