name: Wallet
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/wallet/**'
      - 'deploy/apps/fingerprint*'
      - 'crates/mmx-wallet/**'
      - 'crates/mmx-wallet-wasm/**'
      - 'crates/mmxwallet/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - '.github/workflows/wallet.yml'
  pull_request:
    paths:
      - 'apps/wallet/**'
      - 'deploy/apps/fingerprint*'
      - 'crates/mmx-wallet/**'
      - 'crates/mmx-wallet-wasm/**'
      - 'crates/mmxwallet/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - '.github/workflows/wallet.yml'
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  # Must match the wasm-bindgen crate version in Cargo.lock.
  WASM_BINDGEN_VERSION: '0.2.127'
jobs:
  # Wallet core parity (native vs WASM), unit tests, the hosted web build and
  # the end-to-end suite against a mock chain server.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/wallet
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python3 -m unittest discover -s scripts -p 'test_release.py' -v
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: npm ci --no-audit --no-fund
      - run: npm run build:wasm
      - run: npm run build:wasm -- --test
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/wallet/playwright-report
      - uses: actions/upload-artifact@v7
        with:
          name: mmx-wallet-web
          path: apps/wallet/dist/web

  # The desktop crate is its own Cargo workspace, so the repository's Rust
  # workflow does not reach it: formatting, its unit tests, and lints of the
  # platform-independent code and of the app code (which needs the WebView
  # libraries and the built interface).
  desktop-crate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/wallet
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: python3 -m unittest discover -s src-tauri/tests -p 'test_*.py' -v
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --no-default-features --all-targets -- -D warnings
      # Same libraries as the Linux build container (scripts/Dockerfile.linux).
      - name: Install the WebView libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # The app code embeds the interface (tauri::generate_context!); the
      # desktop interface does not need the WASM package.
      - run: npm ci --no-audit --no-fund
      - run: npx vite build --mode desktop --outDir dist/desktop
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The packaged app's command checks must reach the public chain server;
      # never skip them in CI.
      REQUIRE_CHAIN: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: bash apps/wallet/scripts/build-wasm.sh
      # deb + AppImage built in the Ubuntu 22.04 container, then started under Xvfb.
      - run: bash apps/wallet/scripts/build-linux-container.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mmx-wallet-linux
          path: apps/wallet/artifacts/packages

  macos:
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/wallet
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: npm run build:wasm
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mmx-wallet-macos
          path: apps/wallet/artifacts/packages

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/wallet
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-pc-windows-msvc
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo install wasm-bindgen-cli --version "$env:WASM_BINDGEN_VERSION" --locked
      # From PowerShell, as documented (runs the build in Git for Windows' bash).
      - run: npm run build:wasm
      - run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: mmx-wallet-windows
          path: apps/wallet/artifacts/packages

  release:
    needs: [web, desktop-crate, linux, macos, windows]
    if: github.repository == 'mmx-network/mmx-rust-node' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: wallet-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: mmx-wallet-linux
          path: release-packages
      - uses: actions/download-artifact@v8
        with:
          name: mmx-wallet-macos
          path: release-packages
      - uses: actions/download-artifact@v8
        with:
          name: mmx-wallet-windows
          path: release-packages
      - name: Publish desktop wallet installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash apps/wallet/scripts/publish-release.sh release-packages
