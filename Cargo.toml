[workspace]
members = ["crates/mmx-db", "crates/mmx-types", "crates/mmx-vm", "crates/mmx-execution", "crates/mmx-consensus", "crates/mmx-crypto", "crates/mmx-node"]
exclude = ["vendor/vnx-rust"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
mmx-db = { path = "crates/mmx-db" }
mmx-types = { path = "crates/mmx-types" }
mmx-consensus = { path = "crates/mmx-consensus" }
mmx-crypto = { path = "crates/mmx-crypto" }
mmx-execution = { path = "crates/mmx-execution" }
mmx-vm = { path = "crates/mmx-vm" }
vnx = { path = "vendor/vnx-rust/crates/vnx" }
vnx-codegen = { path = "vendor/vnx-rust/crates/vnx-codegen" }
thiserror = "2"
crc32fast = "1.5"
primitive-types = { version = "0.12", default-features = false, features = ["std"] }
sha2 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
tempfile = "3"

[profile.release]
overflow-checks = true
